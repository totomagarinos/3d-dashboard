services:
  # 1. BASE DE DATOS
  mongodb:
    image: mongo:latest
    container_name: 3d-mongo-prod
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

  # 2. BACKEND (API en Bun)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 3d-api-prod
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=prod
      - PORT=4000
      - DB_URL=mongodb://mongodb:27017/3d-dashboard
      - CORS_ORIGIN=https://3dcostmanager.com
    depends_on:
      - mongodb
    networks:
      - app_network

  # 3. FRONTEND
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 3d-web-prod
    restart: always
    ports:
      - "80:80" # HTTP estándar
      - "443:443" # HTTPS seguro
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - app_network

# Disco duro virtual para que los materiales y cotizaciones sobrevivan
volumes:
  mongo_data:

# Red privada para que los contenedores hablen entre sí de forma segura
networks:
  app_network:
    driver: bridge
